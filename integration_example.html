<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shifu Integration Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .roadmap-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
        
        .module {
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }
        
        .module-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtopic {
            margin-left: 20px;
            padding: 8px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Shifu Learning Roadmap Generator</h1>
        <p class="subtitle">Integration Example for Your Friend's Website</p>
        
        <div class="input-group">
            <label for="query">What do you want to learn?</label>
            <input 
                type="text" 
                id="query" 
                placeholder="e.g., Machine Learning, Web Development, Python Programming"
                value="Python Programming"
            >
        </div>
        
        <div class="input-group">
            <label for="context">Your background (optional)</label>
            <textarea 
                id="context" 
                rows="3" 
                placeholder="e.g., I'm a complete beginner, I know JavaScript, I'm a data analyst..."
            ></textarea>
        </div>
        
        <button onclick="generateRoadmap()">🚀 Generate Learning Roadmap</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">Generating your personalized roadmap...</p>
        </div>
        
        <div class="result" id="result"></div>
    </div>
    
    <script>
        // API Configuration
        const API_URL = 'http://localhost:8000';  // Change to your deployed URL
        
        async function generateRoadmap() {
            const query = document.getElementById('query').value;
            const context = document.getElementById('context').value;
            
            if (!query.trim()) {
                alert('Please enter what you want to learn!');
                return;
            }
            
            // Show loading
            document.getElementById('loading').classList.add('show');
            document.getElementById('result').classList.remove('show');
            
            try {
                // Call Shifu API
                const response = await fetch(`${API_URL}/api/roadmap`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        context: context
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to generate roadmap');
                }
                
                const data = await response.json();
                
                // Display results
                displayRoadmap(data.data);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `
                    <p style="color: red;">❌ Error: ${error.message}</p>
                    <p style="color: #666; margin-top: 10px;">Make sure the Shifu API is running at ${API_URL}</p>
                `;
                document.getElementById('result').classList.add('show');
            } finally {
                document.getElementById('loading').classList.remove('show');
            }
        }
        
        function displayRoadmap(roadmapData) {
            const resultDiv = document.getElementById('result');
            const roadmap = roadmapData.roadmap;
            
            let html = `<h2 class="roadmap-title">${roadmap.title}</h2>`;
            
            roadmap.modules.forEach(module => {
                html += `
                    <div class="module">
                        <div class="module-name">📚 ${module.name}</div>
                        ${renderSubtopics(module.subtopics)}
                    </div>
                `;
            });
            
            resultDiv.innerHTML = html;
            resultDiv.classList.add('show');
        }
        
        function renderSubtopics(subtopics, level = 1) {
            if (!subtopics || subtopics.length === 0) return '';
            
            let html = '';
            subtopics.forEach(sub => {
                const indent = '&nbsp;'.repeat(level * 4);
                html += `
                    <div class="subtopic">
                        ${indent}• ${sub.name}
                        ${renderSubtopics(sub.subtopics, level + 1)}
                    </div>
                `;
            });
            return html;
        }
    </script>
</body>
</html>
